<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="The personal website of Bayzid Silverstein.">
  <title>Bayzid Silverstein</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #080808;
      --foreground: #f2f0eb;
      --muted: #777570;
      --line: rgba(255,255,255,.13);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: var(--background);
      color: var(--foreground);
      font-family: Inter, Helvetica, Arial, sans-serif;
    }
    .page {
      position: relative;
      display: flex;
      min-height: 100svh;
      flex-direction: column;
      justify-content: space-between;
      padding: 34px clamp(22px, 5vw, 76px) 28px;
      isolation: isolate;
    }
    .page::before {
      position: absolute;
      z-index: -1;
      top: 50%;
      left: 50%;
      width: min(72vw, 760px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.055), transparent 68%);
      content: "";
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .monogram {
      color: var(--foreground);
      font-size: .9rem;
      font-weight: 800;
      letter-spacing: -.08em;
    }
    .top-note, footer {
      color: var(--muted);
      font-size: .68rem;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    main {
      display: grid;
      flex: 1;
      place-items: center;
      padding: 48px 0;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(3.1rem, 11.5vw, 10.5rem);
      font-weight: 800;
      line-height: .83;
      letter-spacing: -.095em;
      text-transform: uppercase;
      animation: arrive 1.1s cubic-bezier(.2,.7,.2,1) both;
    }
    h1 span { display: block; }
    h1 span + span { margin-top: .12em; }
    .name-mark {
      display: inline-block;
      width: .12em;
      height: .12em;
      margin-left: .08em;
      border-radius: 50%;
      background: #aaa69e;
      vertical-align: .05em;
    }
    footer { letter-spacing: .12em; }
    .status { display: inline-flex; align-items: center; gap: 9px; }
    .status::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #a5a198;
      content: "";
    }
    @keyframes arrive {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 520px) {
      .page { padding-top: 25px; padding-bottom: 22px; }
      .top-note, footer { font-size: .58rem; }
      h1 { font-size: clamp(3rem, 13vw, 5rem); }
    }
    @media (prefers-reduced-motion: reduce) {
      h1 { animation: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="monogram">BS.</div>
      <div class="top-note">Personal website</div>
    </header>

    <main>
      <h1 aria-label="Bayzid Silverstein">
        <span>Bayzid</span>
        <span>Silverstein<span class="name-mark" aria-hidden="true"></span></span>
      </h1>
    </main>

    <footer>
      <span class="status">Welcome to my space</span>
      <span>© 2026</span>
    </footer>
  </div>
</body>
</html>
