<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808"><meta name="description" content="The personal website of Bayzid Silverstein.">
<title>Bayzid Silverstein</title>
<style>
:root{color-scheme:dark;--bg:#080808;--fg:#f2f0eb;--muted:#85827c}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:Inter,Helvetica,Arial,sans-serif}
.page{position:relative;isolation:isolate;display:flex;min-height:100svh;flex-direction:column;justify-content:space-between;padding:32px clamp(22px,5vw,76px) 26px}
.page:before{position:absolute;z-index:-1;top:50%;left:50%;width:min(72vw,760px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.055),transparent 68%);content:"";transform:translate(-50%,-50%);pointer-events:none}
header,footer{display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{color:var(--fg);font-size:.9rem;font-weight:750;letter-spacing:-.04em;text-decoration:none}
nav{display:flex;align-items:center;gap:clamp(16px,3vw,38px)}
nav a{color:var(--muted);font-size:.68rem;letter-spacing:.14em;text-decoration:none;text-transform:uppercase;transition:color .2s}
nav a:hover,nav a:focus-visible{color:var(--fg)}
main{display:grid;flex:1;place-items:center;padding:48px 0}
.name-lockup{width:max-content;max-width:100%;animation:arrive 1s cubic-bezier(.2,.7,.2,1) both}
h1{margin:0;font-size:clamp(3.1rem,11.5vw,10.5rem);font-weight:800;line-height:.84;letter-spacing:-.095em;text-align:left;text-transform:uppercase}
h1 span{display:block}h1 span+span{margin-top:.13em}
.name-mark{display:inline-block;width:.12em;height:.12em;margin-left:.08em;border-radius:50%;background:#aaa69e;vertical-align:.05em}
footer{color:var(--muted);font-size:.65rem;letter-spacing:.13em;text-transform:uppercase}
.status{display:inline-flex;align-items:center;gap:9px}.status:before{width:6px;height:6px;border-radius:50%;background:#a5a198;content:""}
@keyframes arrive{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:520px){.page{padding-top:24px;padding-bottom:20px}nav{gap:13px}nav a{font-size:.58rem;letter-spacing:.08em}h1{font-size:clamp(2.8rem,12.5vw,5rem)}footer{font-size:.56rem}}
@media(prefers-reduced-motion:reduce){.name-lockup{animation:none}}
</style></head><body><div class="page">
<header><a class="brand" href="index.html">Bayzid</a><nav aria-label="Main navigation"><a href="projects.html">Projects</a><a href="writings.html">Writings</a><a href="contact.html">Contact</a></nav></header>
<main><div class="name-lockup"><h1 aria-label="Bayzid Silverstein"><span>Bayzid</span><span>Silverstein<span class="name-mark" aria-hidden="true"></span></span></h1></div></main>
<footer><span class="status">Welcome to my space</span><span>© 2026</span></footer>
</div></body></html>
